<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <h1 class="app-title">Life Dashboard</h1>
    <button id="btn-theme-toggle">🌙 Dark</button>
  </header>

  <main class="dashboard-grid">

    <!-- Greeting Widget -->
    <section class="card greeting-widget">
      <h2 id="greeting-text">Good Morning</h2>
      <p id="current-time">00:00</p>
      <p id="current-date">Monday, January 1, 2024</p>
    </section>

    <!-- Focus Timer Widget -->
    <section class="card timer-widget">
      <h2>Focus Timer</h2>
      <div id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="btn-start">Start</button>
        <button id="btn-stop">Stop</button>
        <button id="btn-reset">Reset</button>
      </div>
    </section>

    <!-- To-Do List Widget -->
    <section class="card todo-widget">
      <h2>To-Do List</h2>

      <div class="task-input-row">
        <input
          type="text"
          id="task-input"
          placeholder="Add a new task…"
          aria-label="New task description"
        />
        <button id="btn-add-task">Add Task</button>
      </div>
      <p id="task-error" class="error-message" aria-live="polite"></p>

      <div class="sort-controls">
        <button class="sort-btn active" data-sort="creation">Creation Order</button>
        <button class="sort-btn" data-sort="alphabetical">A–Z</button>
        <button class="sort-btn" data-sort="completion">By Status</button>
      </div>

      <ul id="task-list" aria-label="Task list"></ul>
    </section>

    <!-- Quick Links Widget -->
    <section class="card links-widget">
      <h2>Quick Links</h2>

      <div class="link-input-group">
        <input
          type="text"
          id="link-name-input"
          placeholder="Link name"
          aria-label="Link name"
        />
        <input
          type="text"
          id="link-url-input"
          placeholder="URL (e.g. https://example.com)"
          aria-label="Link URL"
        />
        <button id="btn-add-link">Add Link</button>
      </div>
      <p id="link-error" class="error-message" aria-live="polite"></p>

      <ul id="links-list" aria-label="Quick links list"></ul>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
